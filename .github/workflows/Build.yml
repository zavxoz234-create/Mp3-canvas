name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag override; otherwise a unique versioned build release is created'
        required: false
        type: string

concurrency:
  group: android-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.9'
        cache-disabled: true

    - name: Build Debug APK with Gradle
      shell: bash
      run: |
        set +e
        gradle assembleDebug --console=plain 2>&1 | tee build.log
        build_status=${PIPESTATUS[0]}
        if [ "$build_status" -ne 0 ]; then
          {
            echo '### Gradle build output (last 160 lines)'
            echo '```text'
            tail -n 160 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$build_status"
        fi

    - name: Determine release tag
      id: release_tag
      shell: bash
      env:
        REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          tag="$GITHUB_REF_NAME"
        elif [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
          tag="$REQUESTED_RELEASE_TAG"
        else
          version="$(sed -n 's/.*versionName = \"\([^\"]*\)\".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version" ]]; then
            echo 'Could not read versionName from app/build.gradle.kts' >&2
            exit 1
          fi
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: release-assets

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build.outputs.release_tag }}
        target_commitish: ${{ github.sha }}
        name: ${{ needs.build.outputs.release_tag }}
        generate_release_notes: true
        prerelease: ${{ contains(needs.build.outputs.release_tag, '-build.') }}
        files: release-assets/*.apk


