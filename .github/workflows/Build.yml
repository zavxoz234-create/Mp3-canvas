name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version tag to publish as a GitHub Release, for example v0.2.0'
        required: false
        type: string

concurrency:
  group: android-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.9'
        cache-disabled: true

    - name: Build Debug APK with Gradle
      shell: bash
      run: |
        set +e
        gradle assembleDebug --console=plain 2>&1 | tee build.log
        build_status=${PIPESTATUS[0]}
        if [ "$build_status" -ne 0 ]; then
          {
            echo '### Gradle build output (last 160 lines)'
            echo '```text'
            tail -n 160 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$build_status"
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: release-assets

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || github.ref_name }}
        target_commitish: main
        generate_release_notes: true
        files: release-assets/app-debug.apk
